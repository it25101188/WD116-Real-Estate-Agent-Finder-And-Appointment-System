<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agent Profile – RealEstate Finder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">Real<span>Estate</span></div>
  <nav class="sidebar-nav">
    <a href="/agent/dashboard" class="sidebar-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a href="/agent/appointments" class="sidebar-link"><i class="fas fa-calendar-alt"></i> Appointments</a>
    <a href="/agent/profile" class="sidebar-link active"><i class="fas fa-user-cog"></i> My Profile</a>
    <a href="/logout" class="sidebar-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </nav>
</div>
<div class="dashboard-main">
  <div class="dashboard-topbar">
    <h5 class="mb-0 fw-bold"><i class="fas fa-user-cog me-2"></i>Agent Profile</h5>
  </div>
  <div class="dashboard-content">
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show mb-4">
      <i class="fas fa-check-circle me-2"></i><span th:text="${successMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:unless="${agent != null}" class="alert alert-warning mb-4">
      <i class="fas fa-exclamation-triangle me-2"></i>
      Agent profile not linked to your account. Contact admin.
    </div>

    <div class="row justify-content-center" th:if="${agent != null}">
      <div class="col-lg-8">
        <div class="card mb-4">
          <div class="card-body p-4 text-center">
            <div class="agent-avatar-lg mx-auto mb-3" th:text="${agent.firstName.charAt(0)}">A</div>
            <h4 class="fw-bold" th:text="${agent.fullName}">Agent Name</h4>
            <p class="text-muted mb-1" th:text="${agent.specialization}">Specialization</p>
            <div class="stars mb-2 text-warning">
              <i class="fas fa-star" th:each="i : ${#numbers.sequence(1, 5)}"
                 th:classappend="${agent.rating >= i} ? '' : 'text-muted opacity-25'"></i>
            </div>
            <small class="text-muted" th:text="${#numbers.formatDecimal(agent.rating, 1, 1)} + ' (' + ${agent.totalReviews} + ' reviews)'">4.8 (100 reviews)</small>
          </div>
        </div>
        <div class="card">
          <div class="card-body p-4">
            <h5 class="fw-bold mb-4">Edit Agent Profile</h5>
            <form th:action="@{/agent/profile/update}" th:object="${agent}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">First Name</label>
                  <input type="text" th:field="*{firstName}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Last Name</label>
                  <input type="text" th:field="*{lastName}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Email</label>
                  <input type="email" th:field="*{email}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone</label>
                  <input type="tel" th:field="*{phoneNumber}" class="form-control"/>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Specialization</label>
                  <input type="text" th:field="*{specialization}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                  <label class="form-label">License Number</label>
                  <input type="text" th:field="*{licenseNumber}" class="form-control"/>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Years of Experience</label>
                  <input type="number" th:field="*{yearsExperience}" class="form-control" min="0"/>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Office Address</label>
                  <input type="text" th:field="*{officeAddress}" class="form-control"/>
                </div>
                <div class="col-12">
                  <label class="form-label">Bio</label>
                  <textarea th:field="*{bio}" class="form-control" rows="4"></textarea>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Available</label>
                  <div class="form-check form-switch mt-1">
                    <input class="form-check-input" type="checkbox" th:field="*{available}" id="available"/>
                    <label class="form-check-label" for="available">Currently Available</label>
                  </div>
                </div>
              </div>
              <div class="mt-4">
                <button type="submit" class="btn btn-primary px-4">
                  <i class="fas fa-save me-2"></i>Save Changes
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- REVIEWS SECTION -->
        <div class="card mt-4">
          <div class="card-body p-4">
            <h5 class="fw-bold mb-4"><i class="fas fa-star me-2 text-warning"></i>Client Reviews</h5>

            <!-- List of Reviews -->
            <div th:if="${not #lists.isEmpty(reviews)}">
              <div th:each="review : ${reviews}" class="border-bottom mb-3 pb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <div class="d-flex align-items-center gap-2">
                    <div class="rounded-circle bg-light d-flex align-items-center justify-content-center"
                         style="width: 32px; height: 32px; font-weight: bold; font-size: 0.8rem;"
                         th:text="${review.user.firstName.charAt(0)}">U</div>
                    <span class="fw-bold" th:text="${review.user.firstName + ' ' + review.user.lastName}">User Name</span>
                  </div>
                  <div class="text-warning">
                    <i class="fas fa-star" th:each="i : ${#numbers.sequence(1, 5)}"
                       th:classappend="${review.rating >= i} ? '' : 'text-muted opacity-25'"></i>
                  </div>
                </div>
                <p class="mb-1 text-secondary" th:text="${review.comment}">Review comment goes here.</p>
                <small class="text-muted" th:text="${#temporals.format(review.createdAt, 'MMM dd, yyyy')}">Jan 01, 2024</small>
              </div>
            </div>
            <div th:if="${#lists.isEmpty(reviews)}" class="text-center py-4">
              <i class="fas fa-comment-slash fa-3x text-muted opacity-25 mb-3"></i>
              <p class="text-muted">No reviews yet.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
