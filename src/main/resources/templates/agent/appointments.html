<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Appointments – Agent Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-brand">Real<span>Estate</span></div>
    <nav class="sidebar-nav">
        <div class="sidebar-section">Agent Portal</div>
        <a href="/agent/dashboard" class="sidebar-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/agent/appointments" class="sidebar-link active"><i class="fas fa-calendar-alt"></i> Appointments</a>
        <a href="/agent/profile" class="sidebar-link"><i class="fas fa-user-cog"></i> My Profile</a>
        <div class="sidebar-section mt-3">System</div>
        <a href="/logout" class="sidebar-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
</div>

<div class="dashboard-main">
    <div class="dashboard-topbar">
        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-sm btn-outline-secondary d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('show')">
                <i class="fas fa-bars"></i>
            </button>
            <h5 class="mb-0 fw-bold">Client Appointments</h5>
        </div>
        <span class="badge bg-primary px-3 py-2" th:if="${appointments != null}" th:text="${appointments.size()} + ' total'">0 total</span>
    </div>

    <div class="dashboard-content">
        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show mb-4">
            <i class="fas fa-check-circle me-2"></i><span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="table-card">
            <div class="table-header">
                <h5><i class="fas fa-list me-2 text-primary"></i>All Client Appointments</h5>
            </div>

            <div th:if="${appointments == null or appointments.empty}" class="text-center py-5">
                <i class="fas fa-calendar-times fa-4x text-muted mb-3 d-block"></i>
                <h6 class="text-muted">No appointments yet</h6>
            </div>

            <div class="table-responsive" th:unless="${appointments == null or appointments.empty}">
                <table class="table">
                    <thead>
                    <tr><th>#</th><th>Client</th><th>Phone</th><th>Date &amp; Time</th><th>Purpose</th><th>Property</th><th>Budget</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="apt, i : ${appointments}">
                        <td th:text="${i.count}">1</td>
                        <td>
                            <div class="fw-600" th:text="${apt.user.fullName}">Client</div>
                            <small class="text-muted" th:text="${apt.user.email}">email</small>
                        </td>
                        <td th:text="${apt.user.phoneNumber != null ? apt.user.phoneNumber : '—'}">—</td>
                        <td>
                            <div class="fw-600" th:text="${apt.appointmentDate}">Date</div>
                            <small class="text-muted" th:text="${apt.appointmentTime}">Time</small>
                        </td>
                        <td th:text="${apt.purpose}">Purpose</td>
                        <td th:text="${apt.propertyType != null ? apt.propertyType : '—'}">—</td>
                        <td th:text="${apt.budgetRange != null ? apt.budgetRange : '—'}">—</td>
                        <td>
                <span class="badge-pill"
                      th:classappend="${apt.status.name() == 'PENDING'} ? 'badge-pending' :
                                      (${apt.status.name() == 'CONFIRMED'} ? 'badge-confirmed' :
                                      (${apt.status.name() == 'COMPLETED'} ? 'badge-completed' : 'badge-cancelled'))"
                      th:text="${apt.status}">PENDING</span>
                        </td>
                        <td>
                            <div class="d-flex gap-1 align-items-center flex-wrap">
                                <!-- Quick status update -->
                                <form th:action="@{/agent/appointments/update-status/{id}(id=${apt.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <select name="status" class="form-select form-select-sm" style="width:130px;" onchange="this.form.submit()">
                                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == apt.status}">S</option>
                                    </select>
                                </form>
                                <a th:href="@{/agent/appointments/edit/{id}(id=${apt.id})}"
                                   class="btn btn-sm btn-outline-primary btn-icon" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <form th:action="@{/agent/appointments/delete/{id}(id=${apt.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger btn-icon" title="Delete"
                                            onclick="return confirm('Delete this appointment?')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
