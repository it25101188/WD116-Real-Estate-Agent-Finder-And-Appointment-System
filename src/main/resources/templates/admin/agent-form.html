<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${agent.id != null ? 'Edit Agent' : 'New Agent'} + ' – Admin'">Agent Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="sidebar" id="sidebar">
    <div class="sidebar-brand">Real<span>Estate</span></div>
    <nav class="sidebar-nav">
        <a href="/admin/dashboard" class="sidebar-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/admin/users" class="sidebar-link"><i class="fas fa-users"></i> Users</a>
        <a href="/admin/agents" class="sidebar-link active"><i class="fas fa-user-tie"></i> Agents</a>
        <a href="/admin/appointments" class="sidebar-link"><i class="fas fa-calendar-alt"></i> Appointments</a>
        <a href="/logout" class="sidebar-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
</div>
<div class="dashboard-main">
    <div class="dashboard-topbar">
        <h5 class="mb-0 fw-bold" th:text="${agent.id != null ? 'Edit Agent' : 'Add New Agent'}">Agent Form</h5>
        <a href="/admin/agents" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i>Back</a>
    </div>
    <div class="dashboard-content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body p-4">
                        <div th:if="${errorMsg}" class="alert alert-danger mb-3"><i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMsg}"></span></div>

                        <form th:action="@{/admin/agents/save}" th:object="${agent}" method="post" novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" th:field="*{id}"/>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">First Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{firstName}" class="form-control"
                                           th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''" required/>
                                    <div class="invalid-feedback" th:errors="*{firstName}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Last Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{lastName}" class="form-control"
                                           th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''" required/>
                                    <div class="invalid-feedback" th:errors="*{lastName}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email <span class="text-danger">*</span></label>
                                    <input type="email" th:field="*{email}" class="form-control"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required/>
                                    <div class="invalid-feedback" th:errors="*{email}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Phone</label>
                                    <input type="tel" th:field="*{phoneNumber}" class="form-control"/>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Specialization <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{specialization}" class="form-control"
                                           th:classappend="${#fields.hasErrors('specialization')} ? 'is-invalid' : ''" required/>
                                    <div class="invalid-feedback" th:errors="*{specialization}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">License Number</label>
                                    <input type="text" th:field="*{licenseNumber}" class="form-control"/>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Years of Experience</label>
                                    <input type="number" th:field="*{yearsExperience}" class="form-control" min="0" max="60"/>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Rating (0-5)</label>
                                    <input type="number" th:field="*{rating}" class="form-control" step="0.1" min="0" max="5"/>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Total Reviews</label>
                                    <input type="number" th:field="*{totalReviews}" class="form-control" min="0"/>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Office Address</label>
                                    <input type="text" th:field="*{officeAddress}" class="form-control" placeholder="City, State"/>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Bio</label>
                                    <textarea th:field="*{bio}" class="form-control" rows="4" placeholder="Brief agent biography..."></textarea>
                                </div>
                                <div class="col-12">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" th:field="*{available}" id="available"/>
                                        <label class="form-check-label fw-600" for="available">Currently Available for Appointments</label>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-3 mt-4">
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="fas fa-save me-2"></i>
                                    <span th:text="${agent.id != null ? 'Update Agent' : 'Create Agent'}">Save</span>
                                </button>
                                <a href="/admin/agents" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
