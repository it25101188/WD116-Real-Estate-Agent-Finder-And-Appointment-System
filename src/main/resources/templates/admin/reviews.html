<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Manage Reviews – RealEstate Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-brand">Real<span>Estate</span></div>
    <nav class="sidebar-nav">
        <div class="sidebar-section">Admin Panel</div>
        <a href="/admin/dashboard" class="sidebar-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <div class="sidebar-section mt-2">Management</div>
        <a href="/admin/users" class="sidebar-link"><i class="fas fa-users"></i> Users</a>
        <a href="/admin/agents" class="sidebar-link"><i class="fas fa-user-tie"></i> Agents</a>
        <a href="/admin/appointments" class="sidebar-link"><i class="fas fa-calendar-alt"></i> Appointments</a>
        <a href="/admin/reviews" class="sidebar-link active"><i class="fas fa-star"></i> Reviews</a>
        <div class="sidebar-section mt-2">System</div>
        <a href="/" class="sidebar-link"><i class="fas fa-home"></i> Public Site</a>
        <a href="/logout" class="sidebar-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
</div>

<div class="dashboard-main">
    <div class="dashboard-topbar">
        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-sm btn-outline-secondary d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('show')">
                <i class="fas fa-bars"></i>
            </button>
            <h5 class="mb-0 fw-bold">Manage Reviews</h5>
        </div>
        <span class="badge-pill badge-admin">ADMIN</span>
    </div>

    <div class="dashboard-content">
        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show mb-4">
            <i class="fas fa-check-circle me-2"></i><span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="table-card">
            <div class="table-header">
                <h5><i class="fas fa-star me-2 text-warning"></i>All Client Reviews</h5>
            </div>

            <div th:if="${reviews.empty}" class="text-center py-5">
                <i class="fas fa-comment-slash fa-4x text-muted opacity-25 mb-3"></i>
                <h4 class="text-muted">No reviews found</h4>
            </div>

            <div class="table-responsive" th:unless="${reviews.empty}">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Reviewer</th>
                        <th>Agent</th>
                        <th>Rating</th>
                        <th>Comment</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="review : ${reviews}">
                        <td th:text="${review.id}">1</td>
                        <td>
                            <div class="fw-bold" th:text="${review.user.fullName}">User Name</div>
                            <small class="text-muted" th:text="${review.user.email}">email</small>
                        </td>
                        <td>
                            <div class="fw-bold" th:text="${review.agent.fullName}">Agent Name</div>
                            <small class="text-muted" th:text="${review.agent.specialization}">specialization</small>
                        </td>
                        <td>
                            <div class="text-warning">
                                <i class="fas fa-star" th:each="i : ${#numbers.sequence(1, 5)}"
                                   th:classappend="${review.rating >= i} ? '' : 'text-muted opacity-25'"></i>
                            </div>
                        </td>
                        <td>
                            <div class="text-truncate" style="max-width: 250px;" th:text="${review.comment}" th:title="${review.comment}">
                                Comment text...
                            </div>
                        </td>
                        <td th:text="${#temporals.format(review.createdAt, 'MMM dd, yyyy')}">Date</td>
                        <td>
                            <form th:action="@{/admin/reviews/delete/{id}(id=${review.id})}" method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this review?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger btn-icon">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
