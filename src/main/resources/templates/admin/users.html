<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Users – Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">Real<span>Estate</span></div>
  <nav class="sidebar-nav">
    <div class="sidebar-section">Admin Panel</div>
    <a href="/admin/dashboard" class="sidebar-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <div class="sidebar-section mt-2">Management</div>
    <a href="/admin/users" class="sidebar-link active"><i class="fas fa-users"></i> Users</a>
    <a href="/admin/agents" class="sidebar-link"><i class="fas fa-user-tie"></i> Agents</a>
    <a href="/admin/appointments" class="sidebar-link"><i class="fas fa-calendar-alt"></i> Appointments</a>
    <a href="/admin/reviews" class="sidebar-link"><i class="fas fa-star"></i> Reviews</a>
    <div class="sidebar-section mt-2">System</div>
    <a href="/" class="sidebar-link"><i class="fas fa-home"></i> Public Site</a>
    <a href="/logout" class="sidebar-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </nav>
</div>

<div class="dashboard-main">
  <div class="dashboard-topbar">
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-sm btn-outline-secondary d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('show')"><i class="fas fa-bars"></i></button>
      <h5 class="mb-0 fw-bold">Manage Users</h5>
    </div>
    <a href="/admin/users/new" class="btn btn-primary btn-sm"><i class="fas fa-plus me-1"></i>Add User</a>
  </div>

  <div class="dashboard-content">
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show mb-4">
      <i class="fas fa-check-circle me-2"></i><span th:text="${successMsg}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Search -->
    <div class="card mb-4">
      <div class="card-body p-3">
        <form th:action="@{/admin/users}" method="get" class="d-flex gap-2">
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-search"></i></span>
            <input type="text" name="search" class="form-control" placeholder="Search users by name..." th:value="${searchKeyword}"/>
          </div>
          <button type="submit" class="btn btn-primary">Search</button>
          <a href="/admin/users" class="btn btn-outline-secondary">Clear</a>
        </form>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <h5><i class="fas fa-users me-2 text-primary"></i>All Users</h5>
        <span class="badge bg-primary" th:text="${users.size()} + ' users'">0 users</span>
      </div>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th></tr>
          </thead>
          <tbody>
            <tr th:each="u, i : ${users}">
              <td th:text="${i.count}">1</td>
              <td>
                <div class="d-flex align-items-center gap-2">
                  <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#1a56db,#0f172a);display:flex;align-items:center;justify-content:center;color:white;font-size:.8rem;font-weight:700;"
                       th:text="${u.firstName.charAt(0)}">U</div>
                  <span class="fw-600" th:text="${u.fullName}">Name</span>
                </div>
              </td>
              <td th:text="${u.email}">email</td>
              <td th:text="${u.phoneNumber != null ? u.phoneNumber : '—'}">—</td>
              <td>
                <span class="badge-pill"
                      th:classappend="${u.role.name() == 'ADMIN'} ? 'badge-admin' :
                                      (${u.role.name() == 'AGENT'} ? 'badge-agent' : 'badge-user')"
                      th:text="${u.role}">USER</span>
              </td>
              <td>
                <span th:if="${u.enabled}" class="badge-pill badge-available">Active</span>
                <span th:unless="${u.enabled}" class="badge-pill badge-unavailable">Disabled</span>
              </td>
              <td th:text="${u.createdAt != null ? #temporals.format(u.createdAt, 'MMM dd, yyyy') : '—'}">Date</td>
              <td>
                <div class="d-flex gap-1">
                  <a th:href="@{/admin/users/edit/{id}(id=${u.id})}" class="btn btn-sm btn-outline-primary btn-icon" title="Edit"><i class="fas fa-edit"></i></a>
                  <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-outline-danger btn-icon" title="Delete"
                            onclick="return confirm('Delete this user? This will also delete their appointments.')">
                      <i class="fas fa-trash"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
