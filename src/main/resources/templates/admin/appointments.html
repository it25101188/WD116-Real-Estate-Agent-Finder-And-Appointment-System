<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Manage Appointments – Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="sidebar" id="sidebar">
    <div class="sidebar-brand">Real<span>Estate</span></div>
    <nav class="sidebar-nav">
        <a href="/admin/dashboard" class="sidebar-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/admin/users" class="sidebar-link"><i class="fas fa-users"></i> Users</a>
        <a href="/admin/agents" class="sidebar-link"><i class="fas fa-user-tie"></i> Agents</a>
        <a href="/admin/appointments" class="sidebar-link active"><i class="fas fa-calendar-alt"></i> Appointments</a>
        <a href="/admin/reviews" class="sidebar-link"><i class="fas fa-star"></i> Reviews</a>
        <a href="/logout" class="sidebar-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
</div>
<div class="dashboard-main">
    <div class="dashboard-topbar">
        <h5 class="mb-0 fw-bold">Manage Appointments</h5>
        <a href="/admin/appointments/new" class="btn btn-primary btn-sm"><i class="fas fa-plus me-1"></i>New</a>
    </div>
    <div class="dashboard-content">
        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show mb-4">
            <i class="fas fa-check-circle me-2"></i><span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="card mb-4">
            <div class="card-body p-3 d-flex flex-wrap gap-2 align-items-center">
                <span class="fw-600 small me-2">Filter:</span>
                <a href="/admin/appointments" class="btn btn-sm" th:classappend="${selectedStatus == null} ? 'btn-primary' : 'btn-outline-secondary'">All</a>
                <a th:each="s : ${statuses}" th:href="@{/admin/appointments(status=${s})}" class="btn btn-sm"
                   th:classappend="${selectedStatus == s.name()} ? 'btn-primary' : 'btn-outline-secondary'" th:text="${s}">S</a>
            </div>
        </div>
        <div class="table-card">
            <div class="table-header">
                <h5><i class="fas fa-calendar-alt me-2 text-primary"></i>All Appointments</h5>
                <span class="badge bg-primary" th:text="${appointments.size()} + ' total'">0</span>
            </div>
            <div th:if="${appointments.empty}" class="text-center py-5">
                <i class="fas fa-calendar-times fa-3x text-muted mb-3 d-block"></i>
                <p class="text-muted">No appointments found.</p>
            </div>
            <div class="table-responsive" th:unless="${appointments.empty}">
                <table class="table">
                    <thead>
                    <tr><th>#</th><th>Client</th><th>Agent</th><th>Date &amp; Time</th><th>Purpose</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="apt, i : ${appointments}">
                        <td th:text="${i.count}">1</td>
                        <td>
                            <div class="fw-600" th:text="${apt.user.fullName}">Client</div>
                            <small class="text-muted" th:text="${apt.user.email}">email</small>
                        </td>
                        <td>
                            <div class="fw-600" th:text="${apt.agent.fullName}">Agent</div>
                            <small class="text-muted" th:text="${apt.agent.specialization}">spec</small>
                        </td>
                        <td>
                            <div class="fw-600" th:text="${apt.appointmentDate}">Date</div>
                            <small class="text-muted" th:text="${apt.appointmentTime}">Time</small>
                        </td>
                        <td th:text="${apt.purpose}">Purpose</td>
                        <td>
                            <form th:action="@{/admin/appointments/status/{id}(id=${apt.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <select name="status" class="form-select form-select-sm" style="width:130px;" onchange="this.form.submit()">
                                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == apt.status}">S</option>
                                </select>
                            </form>
                        </td>
                        <td>
                            <div class="d-flex gap-1">
                                <a th:href="@{/admin/appointments/edit/{id}(id=${apt.id})}" class="btn btn-sm btn-outline-primary btn-icon" title="Edit"><i class="fas fa-edit"></i></a>
                                <form th:action="@{/admin/appointments/delete/{id}(id=${apt.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger btn-icon" onclick="return confirm('Delete?')"><i class="fas fa-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
