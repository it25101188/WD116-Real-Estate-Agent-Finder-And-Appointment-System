<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Appointment – RealEstate Finder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">Real<span>Estate</span></div>
  <nav class="sidebar-nav">
    <a href="/user/dashboard" class="sidebar-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a href="/agents" class="sidebar-link"><i class="fas fa-users"></i> Find Agents</a>
    <a href="/user/appointments" class="sidebar-link active"><i class="fas fa-calendar-alt"></i> My Appointments</a>
    <a href="/user/profile" class="sidebar-link"><i class="fas fa-user-cog"></i> Profile</a>
    <a href="/logout" class="sidebar-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </nav>
</div>

<div class="dashboard-main">
  <div class="dashboard-topbar">
    <h5 class="mb-0 fw-bold"><i class="fas fa-edit me-2"></i>Edit Appointment</h5>
    <a href="/user/appointments" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i>Back</a>
  </div>

  <div class="dashboard-content">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card">
          <div class="card-body p-4">
            <h5 class="fw-bold mb-4">Update Appointment Details</h5>
            <form th:action="@{/user/appointments/update/{id}(id=${appointment.id})}"
                  th:object="${appointment}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Date <span class="text-danger">*</span></label>
                  <input type="date" th:field="*{appointmentDate}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Time <span class="text-danger">*</span></label>
                  <input type="time" th:field="*{appointmentTime}" class="form-control" required/>
                </div>
                <div class="col-12">
                  <label class="form-label">Purpose <span class="text-danger">*</span></label>
                  <input type="text" th:field="*{purpose}" class="form-control" required/>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Property Type</label>
                  <select th:field="*{propertyType}" class="form-select">
                    <option value="">-- Select --</option>
                    <option th:each="pt : ${propertyTypes}" th:value="${pt}" th:text="${pt}">Type</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Budget Range</label>
                  <select th:field="*{budgetRange}" class="form-select">
                    <option value="">-- Select --</option>
                    <option th:each="br : ${budgetRanges}" th:value="${br}" th:text="${br}">Budget</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label">Property Address</label>
                  <input type="text" th:field="*{propertyAddress}" class="form-control"/>
                </div>
                <div class="col-12">
                  <label class="form-label">Notes</label>
                  <textarea th:field="*{notes}" class="form-control" rows="3"></textarea>
                </div>
              </div>

              <div class="d-flex gap-3 mt-4">
                <button type="submit" class="btn btn-primary px-4">
                  <i class="fas fa-save me-2"></i>Update Appointment
                </button>
                <a href="/user/appointments" class="btn btn-outline-secondary">Cancel</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
