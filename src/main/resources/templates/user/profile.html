<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Profile – RealEstate Finder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="sidebar-brand">Real<span>Estate</span></div>
    <nav class="sidebar-nav">
        <a href="/user/dashboard" class="sidebar-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="/agents" class="sidebar-link"><i class="fas fa-users"></i> Find Agents</a>
        <a href="/user/appointments" class="sidebar-link"><i class="fas fa-calendar-alt"></i> My Appointments</a>
        <a href="/user/profile" class="sidebar-link active"><i class="fas fa-user-cog"></i> Profile</a>
        <a href="/logout" class="sidebar-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
</div>

<div class="dashboard-main">
    <div class="dashboard-topbar">
        <h5 class="mb-0 fw-bold"><i class="fas fa-user-cog me-2"></i>My Profile</h5>
    </div>

    <div class="dashboard-content">
        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show mb-4">
            <i class="fas fa-check-circle me-2"></i><span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show mb-4">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card mb-4">
                    <div class="card-body p-4 text-center">
                        <div class="agent-avatar-lg mx-auto mb-3" th:text="${user.firstName.charAt(0)}">U</div>
                        <h4 class="fw-bold mb-0" th:text="${user.fullName}">User Name</h4>
                        <p class="text-muted" th:text="${user.email}">email@example.com</p>
                        <span class="badge-pill badge-user" th:text="${user.role}">USER</span>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4">Edit Profile</h5>
                        <form th:action="@{/user/profile/update}" th:object="${user}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">First Name</label>
                                    <input type="text" th:field="*{firstName}" class="form-control" required/>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" th:field="*{lastName}" class="form-control" required/>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Email</label>
                                    <input type="email" th:field="*{email}" class="form-control" required/>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Phone Number</label>
                                    <input type="tel" th:field="*{phoneNumber}" class="form-control"/>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">New Password <small class="text-muted">(leave blank to keep current)</small></label>
                                    <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••"/>
                                </div>
                            </div>
                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="fas fa-save me-2"></i>Save Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
