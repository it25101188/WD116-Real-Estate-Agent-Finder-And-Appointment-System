<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – RealEstate Finder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-logo">Real<span>Estate</span></div>
      <p class="text-muted small">Sign in to your account</p>
    </div>

    <!-- Alerts -->
    <div th:if="${errorMsg}" class="alert alert-danger d-flex align-items-center gap-2 mb-3">
      <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMsg}"></span>
    </div>
    <div th:if="${logoutMsg}" class="alert alert-success d-flex align-items-center gap-2 mb-3">
      <i class="fas fa-check-circle"></i> <span th:text="${logoutMsg}"></span>
    </div>
    <div th:if="${successMsg}" class="alert alert-success d-flex align-items-center gap-2 mb-3">
      <i class="fas fa-check-circle"></i> <span th:text="${successMsg}"></span>
    </div>

    <!-- Role Tabs (Visual only to guide user) -->
    <ul class="nav nav-pills nav-justified mb-4 small" id="roleTabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" onclick="setDemo(this, 'user')">User</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="setDemo(this, 'agent')">Agent</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="setDemo(this, 'admin')">Admin</button>
      </li>
    </ul>

    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="mb-3">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          <input type="email" id="email" name="email" class="form-control"
                 placeholder="you@example.com" required autofocus/>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="••••••••" required/>
          <button type="button" class="btn btn-outline-secondary"
                  onclick="togglePass()"><i class="fas fa-eye" id="eyeIcon"></i></button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
        <i class="fas fa-sign-in-alt me-2"></i>Sign In
      </button>
    </form>

    <hr class="my-3"/>
    
    <p class="text-center small mb-0">
      Don't have an account? <a href="/register" class="text-primary fw-600">Register here</a>
    </p>
    <p class="text-center mt-2"><a href="/" class="text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to Home</a></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function togglePass() {
    const p = document.getElementById('password');
    const i = document.getElementById('eyeIcon');
    p.type = p.type === 'password' ? 'text' : 'password';
    i.className = p.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
  }

  function setDemo(btn, role) {
    const email = document.getElementById('email');
    const pass = document.getElementById('password');
    const tabs = document.querySelectorAll('#roleTabs .nav-link');
    
    tabs.forEach(t => t.classList.remove('active'));
    btn.classList.add('active');

    if (role === 'admin') {
      email.value = 'admin@realestate.com';
      pass.value = 'admin123';
    } else if (role === 'agent') {
      email.value = 'agent@realestate.com';
      pass.value = 'agent123';
    } else {
      email.value = 'user@realestate.com';
      pass.value = 'user123';
    }
  }
</script>
<style>
  #roleTabs .nav-link {
    color: #64748b;
    border: 1px solid #e2e8f0;
    margin: 0 2px;
    padding: 5px 10px;
  }
  #roleTabs .nav-link.active {
    background-color: var(--primary-color, #1a56db);
    border-color: var(--primary-color, #1a56db);
    color: white;
  }
</style>
</body>
</html>
