<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – RealEstate Finder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width:520px;">
      <div class="text-center mb-4">
        <div class="auth-logo">Real<span>Estate</span></div>
        <p class="text-muted small">Create your account</p>
      </div>

      <div th:if="${errorMsg}" class="alert alert-danger"><i class="fas fa-exclamation-circle me-2"></i><span
          th:text="${errorMsg}"></span></div>
      <div th:if="${emailError}" class="alert alert-danger"><i class="fas fa-exclamation-circle me-2"></i><span
          th:text="${emailError}"></span></div>

      <form th:action="@{/register}" th:object="${user}" method="post" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label">First Name</label>
            <input type="text" th:field="*{firstName}" class="form-control"
              th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''" placeholder="John" required />
            <div class="invalid-feedback" th:errors="*{firstName}"></div>
          </div>
          <div class="col-6 mb-3">
            <label class="form-label">Last Name</label>
            <input type="text" th:field="*{lastName}" class="form-control"
              th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''" placeholder="Doe" required />
            <div class="invalid-feedback" th:errors="*{lastName}"></div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            <input type="email" th:field="*{email}" class="form-control"
              th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="you@example.com"
              required />
          </div>
          <div class="text-danger small mt-1" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-phone"></i></span>
            <input type="tel" th:field="*{phoneNumber}" class="form-control" placeholder="+1 (555) 000-0000" />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" th:field="*{password}" class="form-control"
              th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" placeholder="Min. 6 characters"
              required />
          </div>
          <div class="text-danger small mt-1" th:errors="*{password}"></div>
        </div>

        <div class="mb-4">
          <label class="form-label">Register As</label>
          <select th:field="*{role}" class="form-select">
            <option value="USER">User (Property Seeker)</option>
            <option value="AGENT">Agent (Real Estate Professional)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
          <i class="fas fa-user-plus me-2"></i>Create Account
        </button>
      </form>

      <p class="text-center small mb-0">
        Already have an account? <a href="/login" class="text-primary fw-600">Sign in</a>
      </p>
      <p class="text-center mt-2"><a href="/" class="text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to
          Home</a></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
